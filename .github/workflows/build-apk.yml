name: Build GAMERS

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Project
        shell: bash
        run: |
          echo "===== PROJECT STRUCTURE ====="
          find . -maxdepth 5 -type f | sort
          echo "============================="

          test -f settings.gradle
          test -f build.gradle
          test -f gradle.properties
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure OK."

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Locate APK
        shell: bash
        run: |
          echo "===== GENERATED APK ====="
          find app/build/outputs/apk -type f -name "*.apk" -print
          echo "========================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAME-TURBO-PRO-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
